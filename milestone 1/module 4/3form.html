<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form label{
            display: block;
        }
    </style>
</head>
<body>
    <header>      
    </header>
    <main>
        <section>
                <fieldset>
                    <legend>basic info</legend>
                    <h2>rivals tourney form</h2>
                <form action="">
                <label for="name">NAME:</label><input type="text">
                <label for="email">E-mail:</label><input type="email">
                <label for="number">Phone:</label><input type="number">
                </fieldset>
                <fieldset>
                    <legend>applicants info</legend>
                    <input type="radio"name="role" id="DPS"><label for="DPS">DPS</label>
                    <input type="radio" name="role" id="TANK"><label for="TANK">TANK</label>
                    <input type="radio" name="role" id="SUPPORT"><label for="SUPPORT">SUPPORT</label>
                </fieldset>
                <fieldset>
                    <legend>HEROES</legend>
                    <input type="checkbox" name="hero" id="MOONKNIGHT"><label for="MOONKNIGHT">MOONKNIGHT</label>
                    <input type="checkbox" name="hero" id="VENOM"><label for="VENOM">VENOM<label>                   
                </fieldset><br><br>
                <fieldset>
                    <legend>EXTRA INFO</legend>
                    <textarea cols="50" rows="10"></textarea>
                </fieldset><br><br>

                <input type="submit" id="submit" style="margin-right: 5px;"> <input type="reset">
            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
