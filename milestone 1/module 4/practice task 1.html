<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice task 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .search img {
            display: block;
        }
        .feedback label{
            display: block;            
        }
    </style>
</head>
<body>
    <section class="search">
        <form action="">
            <label for="">search your image here :</label>
            <input type="text" placeholder="search image">
            <button type="submit">search</button>
            <img src="kung fu panda.jpg" alt="">
            <a href="https://en.wikipedia.org/wiki/Kung_Fu_Panda">Click here for more info</a>
            <hr>
        </form>
    </section>
    <section class="feedback">
        <form action="">
            <h3>Feedback Form:</h3>
            <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            <label for="Date">Date:</label>
                <input type="date" id="date" name="date" required>
            <label for="Comment">Comment:</label>
                <textarea id="comment" name="comment" rows="4" cols="30" required></textarea><br><br>
            <button type="submit">Submit</button>
        </form>
    </section>
    
</body>
</html>
