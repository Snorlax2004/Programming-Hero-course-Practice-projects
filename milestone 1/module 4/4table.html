<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        table{
            border-collapse: collapse;
        }
        td,th{
            border: 2px solid;
            padding: 10px;
        }

    </style>
</head>
<body>
    <main>
        <h2>games</h2>
        <table>
            <caption>games i played</caption>
            <thead> 
                <tr>
                    <th>multi</th>
                    <th>story</th>   
                </tr>    
            </thead>
                <tbody>
                    <tr>
                        <td>rivals</td>
                        <td>valorant</td>
                    </tr>
                    <tr>
                        <td>GOT</td>
                        <td>spider man</td>
                    </tr>
                    <tr>
                        <td>chess</td>
                        <td>ludo</td>
                    </tr>
                </tbody>
                <tfoot>
                    <td colspan="2">total games 6</td>
                </tfoot>
           
        </table>
    </main>

    <section>
        <h2>table info</h2>
        <ul>
            <li>table:table</li>
            <li>table head:thead</li>
            <li>table body:tbody</li>
            <li>table foot:tfoot</li>
        </ul>
    </section>
    
</body>
</html>
